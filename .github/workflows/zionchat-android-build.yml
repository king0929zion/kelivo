name: ZionChat Android Build

on:
  push:
    branches:
      - ui/zionchat-minimal-redesign
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android:
    name: Analyze, Test and Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/chat/widgets/chat_message_widget.dart \
            lib/features/home/pages/home_mobile_layout.dart \
            lib/features/home/widgets/chat_input_bar.dart \
            lib/features/settings/pages/settings_page.dart \
            lib/main.dart \
            lib/shared/widgets/section_card.dart \
            lib/theme/design_tokens.dart \
            lib/theme/palettes.dart \
            lib/theme/theme_factory.dart

      - name: Inject fallback secret shim
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: dart analyze --fatal-infos lib test integration_test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZionChat-Android-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
